<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma Translate GUI</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .container { max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: .5rem; }
        textarea, input[type="file"], input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; }
        textarea { height: 100px; padding: 0.5rem; }
        input[type="text"], input[type="number"] { padding: 0.5rem; }
        button { padding: 0.5rem 1rem; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #task-list { margin-top: 2rem; }
        .task-item { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .progress-bar-container { width: 100%; background-color: #f3f3f3; border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
        .progress-bar { height: 20px; background-color: #28a745; width: 0%; text-align: center; color: white; font-size: 12px; line-height: 20px; transition: width 0.3s; }
        .model-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; background: #fff; }
        .model-table th, .model-table td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; font-size: 13px; }
        .model-table th { background-color: #f1f1f1; }
        .btn-action { padding: 0.25rem 0.5rem; border: none; cursor: pointer; color: white; font-size: 11px; margin-right: 0.25rem; border-radius: 3px; }
        .btn-select { background-color: #007bff; }
        .btn-select:hover { background-color: #0056b3; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #bd2130; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gemma Subtitle Translator</h1>
        <form id="upload-form">
            <div class="form-group">
                <label for="files">Upload .srt files (Batch Upload Supported)</label>
                <input type="file" id="files" name="files" accept=".srt" multiple required>
            </div>
            
            <div class="form-group">
                <label for="model_name">Ollama Model Name</label>
                <input type="text" id="model_name" name="model_name" value="translategemma:4b" required>
            </div>

            <div class="form-group">
                <label for="temperature">Temperature (0.0 = deterministic, 1.0 = creative)</label>
                <input type="number" id="temperature" name="temperature" min="0.0" max="1.0" step="0.1" value="0.3" required>
            </div>

            <div class="form-group">
                <label for="batch_size">Batch Size (Number of lines to translate together)</label>
                <input type="number" id="batch_size" name="batch_size" min="1" max="20" step="1" value="5" required>
            </div>

            <div class="form-group">
                <label for="system_prompt">System Instruction (Pre-filled with default; edit as needed)</label>
                <textarea id="system_prompt" name="system_prompt" required>Translate the following English subtitle lines to Czech. Produce only the translation without explanations.</textarea>
            </div>

            <div class="form-group">
                <label for="context">Translation Context (e.g., "This is a documentary about a plane crash. Translate 'plane' to 'letoun'.")</label>
                <textarea id="context" name="context" placeholder="Enter context here..."></textarea>
            </div>
            
            <button type="submit">Translate</button>
        </form>

        <div id="models-section" style="margin-top: 2rem; border: 1px solid #ddd; padding: 1.5rem; border-radius: 4px; background: #fafafa;">
            <h2 style="margin-top:0;">Installed Ollama Models</h2>
            <button type="button" onclick="loadModels()" style="margin-bottom: 1rem; background: #28a745;">Refresh List</button>
            <div id="models-list">Loading installed models...</div>
        </div>

        <div id="task-list">
            <h2>Translation Tasks</h2>
            <div id="tasks"></div>
        </div>

        <div id="logs-section" style="margin-top: 3rem;">
            <h2>System Logs</h2>
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <button type="button" onclick="fetchLogs('app')">Refresh App Logs</button>
                <button type="button" onclick="fetchLogs('ollama')">Refresh Ollama Logs</button>
            </div>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 340px;">
                    <h3>Application Logs</h3>
                    <pre id="app-logs" style="background: #f8f9fa; border: 1px solid #ddd; padding: 1rem; height: 350px; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; margin: 0;"></pre>
                </div>
                <div style="flex: 1; min-width: 340px;">
                    <h3>Ollama API Traffic Logs</h3>
                    <pre id="ollama-logs" style="background: #f8f9fa; border: 1px solid #ddd; padding: 1rem; height: 350px; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; margin: 0;"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const tasksDiv = document.getElementById('tasks');
        const activeTasks = new Set();

        // Load tasks from persistence on page load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/tasks');
                const tasks = await response.json();
                Object.keys(tasks).forEach(taskId => {
                    const task = tasks[taskId];
                    createTaskElement(taskId);
                    updateTaskUI(taskId, task);
                    if (task.status === 'pending' || task.status === 'processing' || task.status === 'pulling_model') {
                        activeTasks.add(taskId);
                    }
                });
                if (activeTasks.size > 0) {
                    startPolling();
                }
            } catch (err) {
                console.error("Error loading tasks:", err);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.task_ids) {
                    data.task_ids.forEach(taskId => {
                        createTaskElement(taskId);
                        activeTasks.add(taskId);
                    });
                    // Reset files and context inputs but preserve configurations
                    document.getElementById('files').value = '';
                    document.getElementById('context').value = '';
                    
                    startPolling();
                }
            } catch (err) {
                console.error("Error uploading files:", err);
                alert("Failed to start translation.");
            }
        });

        function createTaskElement(taskId) {
            if (document.getElementById(`task-${taskId}`)) return;

            const div = document.createElement('div');
            div.className = 'task-item';
            div.id = `task-${taskId}`;
            div.innerHTML = `
                <strong>Task ID:</strong> ${taskId} <span class="status">(Pending)</span>
                <div class="filename"></div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-${taskId}">0%</div>
                </div>
                <div class="current-task-detail" style="margin-top: 0.5rem; font-size: 13px; color: #666; font-style: italic;"></div>
                <div class="download-link" style="margin-top: 0.5rem; display: none;">
                    <a href="/download/${taskId}" download>Download Translated SRT</a>
                </div>
            `;
            tasksDiv.appendChild(div);
        }

        function updateTaskUI(taskId, data) {
            const taskDiv = document.getElementById(`task-${taskId}`);
            if (!taskDiv) return;

            const statusSpan = taskDiv.querySelector('.status');
            const progressDiv = document.getElementById(`progress-${taskId}`);
            const filenameDiv = taskDiv.querySelector('.filename');
            const detailDiv = taskDiv.querySelector('.current-task-detail');

            if (data.filename) {
                filenameDiv.innerText = `File: ${data.filename}`;
            }

            if (data.status === 'completed') {
                statusSpan.innerText = '(Completed)';
                statusSpan.style.color = 'inherit';
                progressDiv.style.width = '100%';
                progressDiv.innerText = '100%';
                progressDiv.style.backgroundColor = '#28a745';
                taskDiv.querySelector('.download-link').style.display = 'block';
                if (detailDiv) {
                    detailDiv.innerText = 'Translation complete.';
                }
            } else if (data.status === 'pulling_model') {
                statusSpan.innerText = '(Pulling Model...)';
                statusSpan.style.color = '#ff8800';
                progressDiv.style.width = '100%';
                progressDiv.innerText = 'Downloading model...';
                progressDiv.style.backgroundColor = '#ff8800';
                if (detailDiv) {
                    detailDiv.innerText = 'Model is missing locally in Ollama. Pulling model from Ollama library (this can take a few minutes, see Ollama Logs below)...';
                }
            } else if (data.status === 'processing') {
                statusSpan.innerText = '(Processing)';
                statusSpan.style.color = 'inherit';
                const percent = Math.round((data.progress / data.total) * 100) || 0;
                progressDiv.style.width = `${percent}%`;
                progressDiv.innerText = `${percent}%`;
                progressDiv.style.backgroundColor = '#28a745';
                if (detailDiv && data.current_text) {
                    detailDiv.innerText = `Translating batch: ${data.current_text}`;
                } else if (detailDiv) {
                    detailDiv.innerText = 'Translating...';
                }
            } else if (data.status === 'failed') {
                statusSpan.innerText = '(Failed)';
                statusSpan.style.color = 'red';
                progressDiv.style.backgroundColor = 'red';
                progressDiv.style.width = '100%';
                progressDiv.innerText = 'Error';
                if (detailDiv) {
                    detailDiv.innerText = 'Failed to process file. Make sure your Ollama URL and model are correct.';
                }
            } else if (data.status === 'pending') {
                statusSpan.innerText = '(Pending)';
                statusSpan.style.color = 'inherit';
                progressDiv.style.width = '0%';
                progressDiv.innerText = '0%';
                if (detailDiv) {
                    detailDiv.innerText = 'Waiting in queue...';
                }
            }
        }

        let pollingInterval = null;

        function startPolling() {
            if (pollingInterval) return;
            pollingInterval = setInterval(pollTasks, 2000);
        }

        async function pollTasks() {
            if (activeTasks.size === 0) {
                clearInterval(pollingInterval);
                pollingInterval = null;
                return;
            }

            for (const taskId of activeTasks) {
                try {
                    const response = await fetch(`/status/${taskId}`);
                    const data = await response.json();

                    updateTaskUI(taskId, data);

                    if (data.status === 'completed' || data.status === 'failed') {
                        activeTasks.delete(taskId);
                    }
                } catch (err) {
                    console.error(`Error polling task ${taskId}:`, err);
                }
            }
        }

        async function fetchLogs(type) {
            try {
                const response = await fetch(`/logs/${type}`);
                const data = await response.json();
                const element = document.getElementById(`${type}-logs`);
                if (element) {
                    element.textContent = data.logs;
                    element.scrollTop = element.scrollHeight;
                }
            } catch (err) {
                console.error(`Error fetching ${type} logs:`, err);
            }
        }

        // Auto-refresh logs every 5 seconds if there are active tasks
        setInterval(() => {
            if (activeTasks.size > 0) {
                fetchLogs('app');
                fetchLogs('ollama');
            }
        }, 5000);

        async function loadModels() {
            const listDiv = document.getElementById("models-list");
            listDiv.innerHTML = "<em>Loading installed models...</em>";
            try {
                const response = await fetch("/models");
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                const data = await response.json();
                const models = data.models || [];
                if (models.length === 0) {
                    listDiv.innerHTML = "<p>No models installed. Type a name above to auto-pull on translate.</p>";
                    return;
                }
                
                let html = '<table class="model-table">';
                html += '<thead><tr><th>Model Name</th><th>Size</th><th>Actions</th></tr></thead><tbody>';
                models.forEach(model => {
                    const name = model.name;
                    const sizeBytes = model.size || 0;
                    let sizeStr = "Unknown";
                    if (sizeBytes > 0) {
                        const sizeGB = sizeBytes / (1024 * 1024 * 1024);
                        if (sizeGB >= 1) {
                            sizeStr = sizeGB.toFixed(2) + " GB";
                        } else {
                            sizeStr = (sizeBytes / (1024 * 1024)).toFixed(1) + " MB";
                        }
                    }
                    
                    html += `<tr>
                        <td><strong>${name}</strong></td>
                        <td>${sizeStr}</td>
                        <td>
                            <button type="button" class="btn-action btn-select" onclick="selectModel('${name}')">Use</button>
                            <button type="button" class="btn-action btn-delete" onclick="deleteModel('${name}')">Delete</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                listDiv.innerHTML = html;
            } catch (err) {
                console.error("Error loading models:", err);
                listDiv.innerHTML = `<p style="color: red;">Error loading models: ${err.message || err}</p>`;
            }
        }

        function selectModel(name) {
            document.getElementById("model_name").value = name;
        }

        async function deleteModel(name) {
            if (!confirm(`Are you sure you want to delete model '${name}' from your local machine?`)) {
                return;
            }
            try {
                const response = await fetch(`/models/${encodeURIComponent(name)}`, {
                    method: "DELETE"
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "Failed to delete model.");
                }
                alert(result.message || "Model deleted successfully.");
                loadModels();
            } catch (err) {
                console.error("Error deleting model:", err);
                alert(`Error: ${err.message || err}`);
            }
        }

        // Initial fetch on page load
        window.addEventListener('load', () => {
            fetchLogs('app');
            fetchLogs('ollama');
            loadModels();
        });
    </script>
</body>
</html>
